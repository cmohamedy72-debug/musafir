<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 620">
  <defs>
    <linearGradient id="shade" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".10"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".16"/>
    </linearGradient>
    <clipPath id="body"><rect x="30" y="150" width="140" height="460" rx="16"/></clipPath>
  </defs>
  <!-- carabiner -->
  <g fill="none" stroke="#8E9296" stroke-width="9" stroke-linecap="round">
    <path d="M100 18 C70 18 64 60 76 88 L88 112"/>
    <path d="M100 18 C130 18 136 60 124 88 L112 112"/>
  </g>
  <rect x="88" y="104" width="24" height="18" rx="4" fill="#8E9296"/>
  <circle cx="100" cy="128" r="14" fill="none" stroke="#8E9296" stroke-width="7"/>
  <!-- strap -->
  <rect x="78" y="128" width="44" height="48" rx="4" fill="#E2D2B8"/>
  <path d="M82 132 V172 M118 132 V172" stroke="#c9b597" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- body -->
  <g clip-path="url(#body)">
    <rect x="30" y="150" width="140" height="460" fill="#E8D9C0"/>
    <path d="M30 400 C70 372 110 390 170 360 V610 H30Z" fill="#D9AE86"/>
    <path d="M30 448 C80 420 120 446 170 418 V610 H30Z" fill="#C48967"/>
    <path d="M30 500 C70 480 120 500 170 474 V610 H30Z" fill="#A87553"/>
    <path d="M30 552 C80 530 120 550 170 530 V610 H30Z" fill="#856649"/>
    <rect x="30" y="150" width="140" height="460" fill="url(#shade)"/>
  </g>
  <!-- top seam -->
  <path d="M34 164 H166" stroke="#d2bf9f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- crescent -->
  <path d="M112 236 a34 34 0 1 0 22 52 a28 28 0 1 1 -22 -52Z" fill="#B07A55"/>
</svg>
